name: Validate and scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate marketplace and plugin
        run: node .github/scripts/validate.mjs
      - name: Scan current files and Git history for secrets
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          extra_args: --results=verified,unknown
